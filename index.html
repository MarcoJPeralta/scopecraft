<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ScopeCraft helps freelancers and agencies scope projects and turn them into client-ready budget proposals."
    />
    <title>ScopeCraft — Project Scope & Budget Builder</title>
    <script>
      // Apply the saved theme before React loads to avoid a flash of the wrong theme
      try {
        var theme = localStorage.getItem("theme");
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }
        document.documentElement.classList.add(theme);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
